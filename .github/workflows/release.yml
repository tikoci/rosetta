name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Optional release version override (e.g. v0.2.0). Default: v + package.json version.
          Latest-channel runs only — leave blank for prerelease (package.json has a -alpha/-beta/-rc
          suffix) dispatches, since the true published version gets a run-number suffix computed
          during the run and can't be predicted ahead of dispatch. Exception: republish_assets: true
          on a prerelease version requires this to be set to the exact already-published
          run-numbered version (e.g. v0.11.0-alpha.42), since CI cannot recompute a past run's number.
        required: false
        type: string
        default: ''
      docs_date:
        description: 'Export date or presumed RouterOS version for traceability (e.g. 2026-03-25)'
        required: false
        type: string
        default: '2026-05-26'
      full_versions:
        description: 'Extract all RouterOS versions (true) or single primary only (false)'
        required: false
        type: boolean
        default: true
      republish_assets:
        description: >
          Reupload GitHub Release assets and OCI tags for an existing version.
          Does NOT re-publish npm; bump package.json version for a new npm package.
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

# Phase B (#42) job graph: build → qa → publish → bunx-smoke.
#
#   build    extracts + stamps the DB once, runs the fast-fail + preflight gates,
#            and hands the DB (and the workspace-rewritten package.json) to the
#            downstream jobs as artifacts.
#   qa       `uses: ./.github/workflows/qa.yml` with db_source=artifact — the ONE
#            definition of the release-locked gates (contract, retrieval evals,
#            DB-content floors, db-meta) now runs here, against the exact DB build
#            produced. No inline copy of those gates (or the floors) lives in this
#            file anymore, so there is nothing to drift.
#   publish  side effects only — OCI push, GitHub Release, npm publish — gated
#            behind `needs: [build, qa]` so nothing ships unless qa is green.
#   bunx-smoke  end-to-end install smoke of the just-published npm package.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      stage: ${{ steps.channel.outputs.stage }}
      version: ${{ steps.release_version.outputs.version }}
      source: ${{ steps.release_version.outputs.source }}
      short_sha: ${{ steps.image_meta.outputs.short_sha }}
      pages: ${{ steps.stats.outputs.pages }}
      commands: ${{ steps.stats.outputs.commands }}
      versions: ${{ steps.stats.outputs.versions }}
      devices: ${{ steps.stats.outputs.devices }}
      properties: ${{ steps.stats.outputs.properties }}
      videos: ${{ steps.stats.outputs.videos }}
      segments: ${{ steps.stats.outputs.segments }}
      hardware_catalog: ${{ steps.stats.outputs.hardware_catalog }}
      device_aliases: ${{ steps.stats.outputs.device_aliases }}
      previous_version: ${{ steps.previous_version.outputs.previous_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install

      # ── npm channel detection ──
      # package.json's committed version is the single source of truth for
      # channel: a prerelease identifier (MAJOR.MINOR.PATCH-<stage> or
      # -<stage>.N) means non-latest; a bare version means latest. No CI-side
      # flag duplicates this. For prerelease channels, package.json's version
      # is rewritten in-place (workspace-only, never committed) to append
      # $GITHUB_RUN_NUMBER, so repeated dispatches of the same stage never
      # collide on an already-published npm version. The rewritten package.json
      # is uploaded as an artifact at the end of this job so the `publish` job
      # (a fresh runner) publishes the exact version this job computed and the
      # preflight validated.
      - name: Determine npm release channel
        id: channel
        env:
          REPUBLISH_ASSETS: ${{ inputs.republish_assets }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [[ "$PKG_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([A-Za-z]+)(\.[0-9]+)?$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            STAGE="$(echo "${BASH_REMATCH[2]}" | tr '[:upper:]' '[:lower:]')"
            case "$STAGE" in
              alpha|beta|rc) ;;
              *)
                echo "::error::Unrecognized prerelease stage '$STAGE' in package.json version '$PKG_VERSION' — allowed stages: alpha, beta, rc"
                exit 1
                ;;
            esac

            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

            if [ "$REPUBLISH_ASSETS" = "true" ]; then
              if [ -z "$INPUT_VERSION" ]; then
                echo "::error::republish_assets=true with a prerelease package.json version ($PKG_VERSION) requires inputs.version set to the exact already-published run-numbered version (e.g. v${BASE}-${STAGE}.42) — package.json's committed version has no run-number suffix and was never itself published."
                exit 1
              fi
              echo "republish_assets=true — package.json version left as committed ($PKG_VERSION); inputs.version ($INPUT_VERSION) carries the exact already-published version instead."
            else
              NEW_VERSION="${BASE}-${STAGE}.${GITHUB_RUN_NUMBER}"
              node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='$NEW_VERSION'; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
              echo "✓ Rewrote package.json version (workspace-only, not committed): $PKG_VERSION → $NEW_VERSION"
            fi
          elif [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "stage=" >> "$GITHUB_OUTPUT"
            echo "✓ Bare version $PKG_VERSION — latest channel, no rewrite"
          else
            echo "::error::package.json version '$PKG_VERSION' doesn't match a recognized shape — expected MAJOR.MINOR.PATCH (latest) or MAJOR.MINOR.PATCH-<stage>[.N] with <stage> one of alpha/beta/rc (prerelease). Fix the committed version before dispatching."
            exit 1
          fi

      # ── Capture the previously-published version on this same channel ──
      # bunx-upgrade-smoke needs a real "before" version to seed a stale DB
      # from, on the SAME dist-tag this run is about to publish (latest, or
      # the prerelease stage) — not just any GitHub Release. Empty output
      # (no prior publish on this tag yet, e.g. the first-ever alpha) skips
      # that job entirely rather than failing on a nonexistent upgrade path.
      - name: Capture previously-published version (for upgrade smoke)
        id: previous_version
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          STAGE: ${{ steps.channel.outputs.stage }}
        run: |
          set -euo pipefail
          NPM_TAG="latest"
          if [ "$CHANNEL" = "prerelease" ]; then
            NPM_TAG="$STAGE"
          fi
          NPM_VIEW_ERR=$(mktemp)
          trap 'rm -f "$NPM_VIEW_ERR"' EXIT
          if PREV=$(npm view "@tikoci/rosetta@${NPM_TAG}" version --registry https://registry.npmjs.org/ 2>"$NPM_VIEW_ERR"); then
            :
          else
            status=$?
            # A missing dist-tag (e.g. the first alpha release) is the only
            # expected lookup failure. Any registry/auth/transport failure
            # must fail the release rather than silently skipping this gate.
            if grep -Eq '^(npm error|npm ERR!) code E404$' "$NPM_VIEW_ERR"; then
              PREV=""
            else
              cat "$NPM_VIEW_ERR" >&2
              echo "::error::Could not determine the previous version under dist-tag '$NPM_TAG'."
              exit "$status"
            fi
          fi
          if [ -z "$PREV" ]; then
            echo "previous_version=" >> "$GITHUB_OUTPUT"
            echo "No published version yet under dist-tag '$NPM_TAG' — bunx-upgrade-smoke will be skipped."
          else
            echo "previous_version=v$PREV" >> "$GITHUB_OUTPUT"
            echo "✓ Previous published version under '$NPM_TAG': v$PREV"
          fi

      # ── Latest-channel CHANGELOG gate ──
      # No channel auto-promotes [Unreleased] anymore (bump-version's
      # auto-commit is gone entirely). A bare-version release can't ship
      # without a human having already promoted [Unreleased] -> [<version>]
      # by hand, so this fails loudly instead of shipping undocumented
      # user-visible changes under an unheaded version.
      - name: Verify CHANGELOG promotion for latest-channel release
        if: inputs.republish_assets != true
        run: |
          set -euo pipefail
          if [ "${{ steps.channel.outputs.channel }}" != "latest" ]; then
            echo "Prerelease channel (${{ steps.channel.outputs.channel }}/${{ steps.channel.outputs.stage }}) — CHANGELOG promotion gate not applicable."
            exit 0
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if ! grep -qF "## [$PKG_VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$PKG_VERSION]' heading — promote [Unreleased] to [$PKG_VERSION] by hand before releasing latest. CI no longer auto-bumps versions or promotes CHANGELOG (see MANUAL.md 'Release Workflow')."
            exit 1
          fi
          echo "✓ CHANGELOG.md has a [$PKG_VERSION] heading"

      # inputs.version's equality check below only applies cleanly to
      # latest-channel runs. For prerelease runs, package.json's version was
      # already rewritten above to include $GITHUB_RUN_NUMBER — a value that
      # can't be predicted ahead of dispatch — so leave inputs.version blank
      # for prerelease dispatches; the check then compares package.json
      # against itself and passes. Supplying inputs.version for a prerelease
      # run will (correctly, loudly) fail this check rather than silently
      # publishing under a version nobody asked for.
      - name: Verify npm publish access
        if: inputs.republish_assets != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is empty or unavailable to this workflow"
            exit 1
          fi

          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          RELEASE_VERSION="${INPUT_VERSION:-v${PKG_VERSION}}"
          NPM_VERSION="${RELEASE_VERSION#v}"

          if [ "$NPM_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release version $RELEASE_VERSION does not match package.json version $PKG_VERSION; npm publish uses package.json."
            exit 1
          fi

          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::error::${PKG_NAME}@${PKG_VERSION} is already published; bump package.json before publishing npm."
            exit 1
          fi

          NPM_USER=$(npm whoami --registry https://registry.npmjs.org/)
          COLLABORATORS=$(npm access list collaborators "$PKG_NAME" --json --registry https://registry.npmjs.org/)
          NPM_USER="$NPM_USER" PKG_NAME="$PKG_NAME" COLLABORATORS="$COLLABORATORS" node <<'NODE'
          const user = process.env.NPM_USER;
          const packageName = process.env.PKG_NAME;
          const collaborators = JSON.parse(process.env.COLLABORATORS ?? "{}");
          if (collaborators[user] !== "read-write") {
            const writers = Object.entries(collaborators)
              .filter(([, access]) => access === "read-write")
              .map(([name]) => name)
              .join(", ") || "(none)";
            console.error(`::error::NPM_TOKEN authenticates as ${user}, but ${user} does not have read-write access to ${packageName}. Read-write collaborators: ${writers}`);
            process.exit(1);
          }
          NODE

          echo "✓ npm publish access verified for $PKG_NAME@$PKG_VERSION as $NPM_USER"

      # ── Fast-fail quality gate ──
      # Run before the ~2-minute extraction pipeline so a typecheck/lint
      # regression that slipped past test.yml fails in ~30s, not ~3min.
      # (The qa job re-runs these against the artifact; harmless, and it can't
      # fail-fast ahead of this job's extraction since it `needs: build`.)

      - name: Type check (fast-fail)
        run: bun run typecheck

      - name: Lint (fast-fail)
        run: bun run lint

      - name: Run tests (fast-fail)
        shell: bash
        run: |
          set -euo pipefail
          LOG=$(mktemp)
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set +e
          bun test --coverage --coverage-reporter=text --coverage-reporter=lcov 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" "$LOG"
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            FAIL_LINE=$(grep -E '^ *[0-9]+ fail' "$LOG" || true)
            if [ -n "$FAIL_LINE" ] && ! echo "$FAIL_LINE" | grep -qE '^ *0 fail'; then
              echo "::error::bun test reported failing tests (${FAIL_LINE# }) — see the 'Test coverage' step summary above for which ones."
            else
              echo "::error::bun test exited $status but reported no failing tests (${FAIL_LINE:-no summary line found} — this is NOT a test failure. Likely a coverage threshold in bunfig.toml's [test].coverageThreshold (should be unset — coverage here is meant to be informational only, see VALIDATION.md V-coverage-reported) or a runner crash. Check the coverage table above."
            fi
          fi
          exit "$status"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 30

      - name: Resolve release version
        id: release_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            SOURCE="workflow input"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            VERSION="v${PKG_VERSION}"
            SOURCE="package.json"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "✓ Release version: $VERSION (from $SOURCE)"

      # ── Extraction pipeline ──

      # Live-fetches manual.mikrotik.com's /docs tree (same live-network risk
      # class as the retired Confluence download) and populates
      # pages/sections/properties/callouts. --check-counts --strict proves
      # V-docusaurus-docs-count on every release run, failing the release on
      # either a count mismatch or a skipped (network-unreachable) check.
      - name: Extract Docusaurus pages, properties, callouts
        run: bun run src/extract-docusaurus.ts --check-counts --strict

      - name: Extract command tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.full_versions }}" = "true" ]; then
            bun run src/extract-all-versions.ts
          else
            bun run src/extract-commands.ts
          fi

      # CLI-Reference overlay (#124/#127). extract-cliref live-fetches the cli-reference
      # sitemap and enforces V-cliref-parse-reconcile (throws on parsed-vs-source drift).
      # link-cliref MUST run after "Extract command tree" populated schema_nodes — it fails
      # fast on an empty schema_nodes rather than wiping the crosswalk to all-manual-only.
      - name: Extract CLI-Reference overlay
        run: bun run src/extract-cliref.ts

      # link-cliref needs the command tree. "Extract command tree" only populates
      # schema_nodes on the full-versions path (a single-version / non-dispatch build runs
      # extract-commands, which fills the legacy `commands` table, not schema_nodes). Gate
      # on the actual node count so the link runs only when a crosswalk can form, matching
      # `make extract` (no link-cliref) vs `make extract-full` (link-cliref).
      - name: Link CLI-Reference to inspect
        run: |
          set -euo pipefail
          if [ "$(sqlite3 ros-help.db "SELECT COUNT(*) FROM schema_nodes WHERE type IN ('dir','cmd')")" -gt 0 ]; then
            bun run src/link-cliref.ts
          else
            echo "schema_nodes has no command tree (single-version build) — skipping link-cliref."
          fi

      - name: Extract devices
        run: bun run src/extract-devices.ts

      # Must run after Extract devices: extract-devices.ts wipes device_aliases +
      # hardware_catalog (their device_id links point at AUTOINCREMENT ids a devices
      # rebuild invalidates), so the overlay has to be rebuilt afterwards or its rows
      # get deleted. No network — the ETL reads the committed ros-hardware-assessment.json
      # / ros-www-assessment.json. Stamps db_meta provenance (hardware_catalog_source,
      # _built_at, _matrix_snapshot) itself before writing.
      - name: Extract hardware catalog
        run: bun run src/extract-hardware-catalog.ts

      - name: Extract test results
        run: bun run src/extract-test-results.ts

      - name: Extract changelogs
        run: bun run src/extract-changelogs.ts

      - name: Import video transcripts from cache
        run: make extract-videos-from-cache

      - name: Import Dude wiki docs from cache
        run: make extract-dude-from-cache

      - name: Extract agent skills from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run src/extract-skills.ts

      - name: Link commands to pages
        run: bun run src/link-commands.ts

      - name: GC schema node presence versions
        run: make gc-versions EXTRA_FLAGS=--verbose

      # ── Post-extraction DB-wipe guard ──
      # query.test.ts hard-fails if the DB singleton isn't :memory:, so
      # running tests after extraction detects any regression of the
      # v0.7.6 "tests wiped the built DB" bug before publish.
      # (Typecheck + lint already ran fast-fail above.)

      - name: Run tests (DB-wipe guard)
        run: bun test

      # ── Build and release ──

      - name: Stamp DB provenance (db_meta)
        run: |
          bun run scripts/stamp-db-meta.ts \
            --release-tag "${{ steps.release_version.outputs.version }}" \
            --source-commit "${{ github.sha }}"

      - name: Collect DB stats
        id: stats
        run: |
          PAGES=$(sqlite3 ros-help.db "SELECT COUNT(*) FROM pages")
          COMMANDS=$(sqlite3 ros-help.db "SELECT COUNT(*) FROM commands WHERE type='cmd'")
          VERSIONS=$(sqlite3 ros-help.db "SELECT COUNT(*) FROM ros_versions")
          DEVICES=$(sqlite3 ros-help.db "SELECT COUNT(*) FROM devices")
          PROPERTIES=$(sqlite3 ros-help.db "SELECT COUNT(*) FROM properties")
          PAGE_TABLES=$(sqlite3 ros-help.db "SELECT COUNT(*) FROM page_tables" 2>/dev/null || echo 0)
          PAGE_TABLE_DATA_ROWS=$(sqlite3 ros-help.db "SELECT COALESCE(SUM(data_row_count), 0) FROM page_tables" 2>/dev/null || echo 0)
          VIDEOS=$(sqlite3 ros-help.db "SELECT COUNT(*) FROM videos" 2>/dev/null || echo 0)
          SEGMENTS=$(sqlite3 ros-help.db "SELECT COUNT(*) FROM video_segments WHERE transcript != ''" 2>/dev/null || echo 0)
          HARDWARE_CATALOG=$(sqlite3 ros-help.db "SELECT COUNT(*) FROM hardware_catalog" 2>/dev/null || echo 0)
          DEVICE_ALIASES=$(sqlite3 ros-help.db "SELECT COUNT(*) FROM device_aliases" 2>/dev/null || echo 0)
          {
            echo "pages=$PAGES"
            echo "commands=$COMMANDS"
            echo "versions=$VERSIONS"
            echo "devices=$DEVICES"
            echo "properties=$PROPERTIES"
            echo "page_tables=$PAGE_TABLES"
            echo "page_table_data_rows=$PAGE_TABLE_DATA_ROWS"
            echo "videos=$VIDEOS"
            echo "segments=$SEGMENTS"
            echo "hardware_catalog=$HARDWARE_CATALOG"
            echo "device_aliases=$DEVICE_ALIASES"
          } >> "$GITHUB_OUTPUT"
          echo "✓ DB: $PAGES pages, $COMMANDS commands, $VERSIONS versions, $DEVICES devices, $PROPERTIES properties, $PAGE_TABLES page_tables ($PAGE_TABLE_DATA_ROWS data rows), $VIDEOS videos ($SEGMENTS transcript segments), $HARDWARE_CATALOG hardware_catalog, $DEVICE_ALIASES device_aliases"

      - name: Compute image metadata
        id: image_meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      # Hand the freshly extracted + stamped DB to the qa and publish jobs. The
      # qa job (uses: qa.yml, db_source=artifact) validates THIS artifact — the
      # DB-content floors, contract tests, and retrieval evals all run against the
      # exact bytes publish will ship, so the gates can't pass a different DB than
      # the one released. retention: 7 keeps it downloadable for post-mortem.
      - name: Upload built DB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ros-help-db
          path: ros-help.db
          retention-days: 7

      # The prerelease version rewrite above is workspace-only; carry the mutated
      # package.json to the publish job (a fresh runner) so `npm publish` ships the
      # exact run-numbered version this job computed and the preflight validated —
      # not the committed (suffix-less) version a fresh checkout would have.
      - name: Upload resolved package.json
        uses: actions/upload-artifact@v7
        with:
          name: release-package-json
          path: package.json
          retention-days: 7

  # ── Release-locked quality gates (one definition) ──
  # The contract tests, retrieval evals (golden blocking + self-supervised
  # non-blocking), DB-content floors, and db-meta provenance check all live in
  # qa.yml now. db_source=artifact points them at the DB `build` just uploaded,
  # so this is a true gate on the shipped artifact — not a rehearsal copy.
  # `publish` needs this job, so a red gate blocks every side effect.
  qa:
    needs: build
    uses: ./.github/workflows/qa.yml
    with:
      test_scope: all
      db_source: artifact
      artifact_name: ros-help-db

  publish:
    needs: [build, qa]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The DB that passed the qa gates — the ONLY DB that reaches publishing.
      - name: Download built DB artifact
        uses: actions/download-artifact@v8
        with:
          name: ros-help-db
          path: .

      # Restore the workspace-rewritten package.json (run-numbered prerelease
      # version) over the committed one, so npm publishes the exact version
      # build computed and validated.
      - name: Download resolved package.json
        uses: actions/download-artifact@v8
        with:
          name: release-package-json
          path: .

      - run: bun install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ammo74
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build release artifacts
        run: bun run scripts/build-release.ts ${{ needs.build.outputs.version }}

      # OCI tags mirror the npm dist-tag scheme: $VERSION and sha-$SHORT_SHA
      # always push. republish_assets: true pushes ONLY those two — no
      # floating tag ever moves during a republish, so a re-run of an older
      # version can't regress what a floating tag currently points testers
      # at. Otherwise: prerelease runs get a floating per-stage tag
      # (:alpha/:beta/:rc) and a floating :next; latest-channel runs get the
      # bare :latest tag. :latest never pushes on a prerelease run — this is
      # the fix for the OCI-latest-clobber risk (an unguarded alpha dispatch
      # would otherwise silently overwrite the production /app container's
      # :latest with an unfinished prerelease DB).
      - name: Build and push OCI images (Docker Hub + GHCR)
        env:
          REPUBLISH_ASSETS: ${{ inputs.republish_assets }}
        run: |
          set -euo pipefail
          SHORT_SHA="${{ needs.build.outputs.short_sha }}"
          VERSION="${{ needs.build.outputs.version }}"
          CHANNEL="${{ needs.build.outputs.channel }}"
          STAGE="${{ needs.build.outputs.stage }}"

          tags=()
          for registry in ammo74/rosetta ghcr.io/tikoci/rosetta; do
            tags+=(--tag "${registry}:${VERSION}" --tag "${registry}:sha-${SHORT_SHA}")
            if [ "$REPUBLISH_ASSETS" != "true" ]; then
              if [ "$CHANNEL" = "prerelease" ]; then
                tags+=(--tag "${registry}:${STAGE}" --tag "${registry}:next")
              else
                tags+=(--tag "${registry}:latest")
              fi
            fi
          done

          # Inject DB into the build context so it gets baked into the image
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --build-arg REPO_URL=tikoci/rosetta \
            "${tags[@]}" \
            --push \
            -f Dockerfile.release \
            .

      - name: Smoke test published OCI images
        run: |
          set -euo pipefail
          SHA_TAG="sha-${{ needs.build.outputs.short_sha }}"

          smoke_test_container() {
            local image="$1"
            local name="$2"
            local port="$3"

            docker rm -f "$name" >/dev/null 2>&1 || true
            echo "Starting: docker run -d --name $name -p ${port}:8080 $image"
            docker run -d --name "$name" -p "${port}:8080" "$image"

            ok=0
            for i in $(seq 1 20); do
              state=$(docker inspect "$name" --format '{{.State.Status}}' 2>/dev/null || echo gone)
              if [ "$state" = exited ] || [ "$state" = gone ]; then
                echo "Container exited early (state=$state, attempt=$i)"
                break
              fi
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/mcp" || true)
              if [ "$code" != 000 ] && [ "$code" != 404 ]; then
                ok=1
                break
              fi
              sleep 1
            done

            if [ "$ok" -ne 1 ]; then
              echo "::group::Diagnostic info for $image"
              docker inspect "$name" --format 'Status={{.State.Status}} Exit={{.State.ExitCode}} Error={{.State.Error}} OOMKilled={{.State.OOMKilled}}' 2>&1 || true
              docker logs "$name" 2>&1 || true
              echo "::endgroup::"
              docker rm -f "$name" >/dev/null 2>&1 || true
              return 1
            fi

            docker rm -f "$name" >/dev/null 2>&1 || true
            echo "✓ $image OK (HTTP $code)"
          }

          port=18080
          for image in "ammo74/rosetta:${SHA_TAG}" "ghcr.io/tikoci/rosetta:${SHA_TAG}"; do
            echo "── Smoke testing $image ──"
            docker pull "$image"
            name="rosetta-smoke-$(echo "$image" | tr '/:.' '-')"
            smoke_test_container "$image" "$name" "$port" || {
              echo "::error::Smoke test failed for $image"
              exit 1
            }
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_DATE: ${{ inputs.docs_date }}
          REPUBLISH_ASSETS: ${{ inputs.republish_assets }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"

          # Prerelease runs (including their republish_assets clobbers) mark
          # the GitHub Release as a prerelease so it doesn't show as "Latest".
          PRERELEASE_FLAGS=()
          if [ "${{ needs.build.outputs.channel }}" = "prerelease" ]; then
            PRERELEASE_FLAGS=(--prerelease)
          fi

          NOTES="## Database Stats
          - **Pages:** ${{ needs.build.outputs.pages }}
          - **Commands:** ${{ needs.build.outputs.commands }}
          - **RouterOS Versions:** ${{ needs.build.outputs.versions }}
          - **Devices:** ${{ needs.build.outputs.devices }}
          - **Properties:** ${{ needs.build.outputs.properties }}
          - **Videos:** ${{ needs.build.outputs.videos }} (${{ needs.build.outputs.segments }} transcript segments)

          ## Build Info
          - **Commit:** ${{ github.sha }}
          - **Docs date:** ${DOCS_DATE:-not specified}
          - **Release version source:** ${{ needs.build.outputs.source }}
          - **Full version extraction:** ${{ inputs.full_versions }}
          - **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          gh_retry() {
            local attempt=1
            local max_attempts=4
            local delay=5
            local label="$1 ${2:-} ${3:-}"
            local status=0
            while true; do
              if "$@"; then
                return 0
              else
                status=$?
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$status"
              fi
              echo "::warning::GitHub release command failed with exit $status (attempt $attempt/$max_attempts): ${label}; retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          ensure_release_exists() {
            if gh release view "$VERSION" >/dev/null 2>&1; then
              return 0
            fi

            local attempt=1
            local max_attempts=4
            local delay=5
            while true; do
              if gh release create "$VERSION" --title "$VERSION" --notes "$NOTES" "${PRERELEASE_FLAGS[@]}"; then
                return 0
              fi
              # GitHub can return a transient 5xx after creating the release.
              # Treat "now visible" as success so reruns and in-step retries are idempotent.
              if gh release view "$VERSION" >/dev/null 2>&1; then
                echo "::warning::Release $VERSION exists after a failed create response; continuing with asset upload."
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "::warning::GitHub release create failed (attempt $attempt/$max_attempts); retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          if [ "$REPUBLISH_ASSETS" = "true" ]; then
            # Create release if it doesn't exist, then reupload assets with clobber.
            ensure_release_exists
            gh_retry gh release upload "$VERSION" dist/*.zip dist/ros-help.db.gz --clobber
            gh_retry gh release edit "$VERSION" --notes "$NOTES" "${PRERELEASE_FLAGS[@]}"
            echo "✓ Release $VERSION updated"
          elif gh release view "$VERSION" >/dev/null 2>&1; then
            # A previous run may have created the GitHub Release and then failed
            # at npm publish. The npm preflight above rejects already-published
            # package versions, so this retry path is safe to clobber assets.
            gh_retry gh release upload "$VERSION" dist/*.zip dist/ros-help.db.gz --clobber
            gh_retry gh release edit "$VERSION" --notes "$NOTES" "${PRERELEASE_FLAGS[@]}"
            echo "✓ Release $VERSION updated before npm publish retry"
          else
            ensure_release_exists
            gh_retry gh release upload "$VERSION" dist/*.zip dist/ros-help.db.gz --clobber
            gh_retry gh release edit "$VERSION" --notes "$NOTES" "${PRERELEASE_FLAGS[@]}"
            echo "✓ Release $VERSION created"
          fi

      # npm is immutable — you cannot republish the same version with different
      # contents. `republish_assets: true` re-clobbers GH release assets and OCI
      # tags, but trying to re-push npm would always 403. Skip npm in that mode.
      #
      # Prerelease runs publish under their stage's dist-tag (--tag alpha/beta/rc)
      # instead of the default `latest`, then move the `next` dist-tag to point at
      # this version too, so `next` always resolves to the newest prerelease of
      # any stage while `alpha`/`beta`/`rc` each stay pinned to their own stage's
      # latest. Bare (latest-channel) publishes are unchanged: no --tag, defaults
      # to the `latest` dist-tag.
      - name: Publish to npm
        if: inputs.republish_assets != true
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          NPM_VERSION="${{ needs.build.outputs.version }}"
          NPM_VERSION="${NPM_VERSION#v}"
          if [ "${{ needs.build.outputs.channel }}" = "prerelease" ]; then
            npm publish --access public --tag "${{ needs.build.outputs.stage }}" --registry https://registry.npmjs.org/
            npm dist-tag add "${PKG_NAME}@${NPM_VERSION}" next --registry https://registry.npmjs.org/
          else
            npm publish --access public --registry https://registry.npmjs.org/
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm publish (republish_assets mode)
        if: inputs.republish_assets == true
        run: echo "republish_assets=true → skipping npm publish (npm versions are immutable; bump package.json for a new npm package)"

  # End-to-end bunx smoke — replicates exactly what users hit:
  # fresh runner → bunx pulls the just-published @tikoci/rosetta → --refresh
  # downloads the DB and opens it. Matrix now covers macOS + Linux + Windows so
  # the v0.8.x Windows EBUSY / temp-artifact class and the macOS readonly-WAL
  # class are both exercised on the release path.
  #
  # Consumes needs.publish.outputs.version rather than assuming it
  # equals package.json's committed value — prerelease runs rewrite the
  # version in-workspace (with a run-number suffix) before npm publish, so
  # this job output is the only reliable source for "what actually published."
  bunx-smoke:
    needs: publish
    if: inputs.republish_assets != true  # republish_assets skips npm publish, so nothing to smoke
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Wait for npm registry to propagate @tikoci/rosetta@${{ needs.publish.outputs.version }}
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          # Strip leading v — npm versions are unprefixed.
          NPM_VER="${VERSION#v}"
          echo "Waiting for @tikoci/rosetta@${NPM_VER} on npm registry..."
          for i in {1..30}; do
            if npm view "@tikoci/rosetta@${NPM_VER}" version >/dev/null 2>&1; then
              echo "✓ npm registry has ${NPM_VER} (attempt $i)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::npm registry did not surface @tikoci/rosetta@${NPM_VER} within 150s"
          exit 1

      - name: bunx --refresh exits 0 (DB downloads + opens cleanly)
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          NPM_VER="${VERSION#v}"
          # Pin to the exact version so a stale `latest` tag can't mask a broken build.
          echo "── bunx @tikoci/rosetta@${NPM_VER} --refresh ──"
          bunx "@tikoci/rosetta@${NPM_VER}" --refresh
          # DB should now exist and be readable from a second invocation
          # (this is where the v0.8.0 readonly-probe bug would reappear).
          echo "── bunx @tikoci/rosetta@${NPM_VER} --version ──"
          OUT=$(bunx "@tikoci/rosetta@${NPM_VER}" --version)
          echo "$OUT"
          echo "$OUT" | grep -F "${NPM_VER}" > /dev/null

      - name: MCP server starts and DB probe succeeds
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          NPM_VER="${VERSION#v}"
          # Spawn the HTTP server, wait for /mcp to answer, shut down.
          # If ensureDbReady's probe regresses (e.g. readonly-on-WAL), the
          # server exits with "Still incompatible after re-download" and /mcp
          # never responds.
          PORT=18765
          LOG="${RUNNER_TEMP}/rosetta-bunx-smoke-${{ matrix.os }}.log"
          rm -f "$LOG"
          bunx "@tikoci/rosetta@${NPM_VER}" --http --port "$PORT" --host 127.0.0.1 > "$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          ok=0
          for _ in {1..30}; do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::Server exited early"
              cat "$LOG"
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/mcp" || true)
            if [ "$code" != 000 ] && [ "$code" != 404 ]; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::MCP server never answered on /mcp"
            cat "$LOG"
            exit 1
          fi
          echo "✓ MCP server answered (HTTP $code)"
          echo "── server log (first 40 lines) ──"
          head -40 "$LOG"

  # End-to-end DB-freshness upgrade smoke — the actual bug #76/#23 traced and
  # #78 fixed: a bunx cache + DB seeded by the PREVIOUS published version on
  # this same dist-tag, then a bare (no --refresh) invocation of the version
  # THIS run just published, proving ensureDbReady()'s checkDbFreshness
  # release-tag comparison auto-refreshes the DB instead of silently leaving
  # it stale. bunx-smoke above only ever installs fresh onto an empty cache,
  # so it can't catch this class of bug at all. Skipped when there's no prior
  # publish on this channel yet (needs.build.outputs.previous_version empty).
  bunx-upgrade-smoke:
    needs: [build, publish]
    if: inputs.republish_assets != true && needs.build.outputs.previous_version != ''
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Wait for npm registry to resolve this channel to ${{ needs.publish.outputs.version }}
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          STAGE: ${{ needs.build.outputs.stage }}
        run: |
          set -euo pipefail
          NPM_VER="${VERSION#v}"
          NPM_SPEC="@tikoci/rosetta"
          if [ "$CHANNEL" = "prerelease" ]; then
            NPM_SPEC="${NPM_SPEC}@${STAGE}"
          fi
          echo "Waiting for ${NPM_SPEC} to resolve to ${NPM_VER} on npm registry..."
          for i in {1..30}; do
            if [ "$(npm view "$NPM_SPEC" version 2>/dev/null || true)" = "$NPM_VER" ]; then
              echo "✓ ${NPM_SPEC} resolves to ${NPM_VER} (attempt $i)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::npm registry did not resolve ${NPM_SPEC} to ${NPM_VER} within 150s"
          exit 1

      - name: Bare bunx of the new version auto-refreshes a DB seeded by the previous version (no --refresh)
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          PREV_VERSION: ${{ needs.build.outputs.previous_version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          STAGE: ${{ needs.build.outputs.stage }}
        run: |
          set -euo pipefail
          NPM_VER="${VERSION#v}"
          PREV_NPM_VER="${PREV_VERSION#v}"
          NPM_SPEC="@tikoci/rosetta"
          if [ "$CHANNEL" = "prerelease" ]; then
            NPM_SPEC="${NPM_SPEC}@${STAGE}"
          fi

          echo "── bunx @tikoci/rosetta@${PREV_NPM_VER} --refresh (seed pre-upgrade DB) ──"
          bunx "@tikoci/rosetta@${PREV_NPM_VER}" --refresh

          PORT=18766
          LOG="${RUNNER_TEMP}/rosetta-upgrade-smoke-${{ matrix.os }}.log"
          rm -f "$LOG"
          echo "── bunx ${NPM_SPEC} --http (bare/tag form — proves the real client path, not an exact pin) ──"
          bunx "$NPM_SPEC" --http --port "$PORT" --host 127.0.0.1 > "$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          ok=0
          for _ in {1..30}; do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::Server exited early"
              cat "$LOG"
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/mcp" || true)
            if [ "$code" != 000 ] && [ "$code" != 404 ]; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::MCP server never answered on /mcp"
            cat "$LOG"
            exit 1
          fi

          echo "── server log ──"
          cat "$LOG"

          # ensureDbReady's startup banner names the release actually served.
          # If checkDbFreshness's release-tag comparison (or its wiring into
          # mcp.ts) ever regresses, this would still show ${PREV_VERSION} here.
          if ! grep -F "release v${NPM_VER}" "$LOG" > /dev/null; then
            echo "::error::Server log does not show release v${NPM_VER} — DB did not auto-refresh across the ${PREV_VERSION} -> v${NPM_VER} upgrade (see #76/#23/#78)"
            exit 1
          fi
          echo "✓ DB auto-refreshed from ${PREV_VERSION} to release v${NPM_VER} without a manual --refresh"

      - name: ROSETTA_OFFLINE=1 degrades gracefully on a stale DB instead of crashing
        env:
          PREV_VERSION: ${{ needs.build.outputs.previous_version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          STAGE: ${{ needs.build.outputs.stage }}
        run: |
          set -euo pipefail
          PREV_NPM_VER="${PREV_VERSION#v}"
          NPM_SPEC="@tikoci/rosetta"
          if [ "$CHANNEL" = "prerelease" ]; then
            NPM_SPEC="${NPM_SPEC}@${STAGE}"
          fi

          # The previous step proved that this DB was refreshed by the current
          # release. Record its schema before replacing it with the old DB
          # below: offline fallback is only valid for a release-tag mismatch,
          # never for a genuinely incompatible schema.
          DB_PATH="$HOME/.rosetta/ros-help.db"
          CURRENT_SCHEMA=$(DB_PATH="$DB_PATH" bun --eval 'import sqlite from "bun:sqlite"; const db = new sqlite(process.env.DB_PATH); console.log(db.query("PRAGMA user_version").get().user_version); db.close();')

          # Re-seed the stale (previous-version) DB — the prior step already
          # upgraded it to the current release, so this step needs its own
          # stale copy.
          echo "── re-seeding stale DB (@${PREV_NPM_VER}) ──"
          bunx "@tikoci/rosetta@${PREV_NPM_VER}" --refresh

          SEEDED_SCHEMA=$(DB_PATH="$DB_PATH" bun --eval 'import sqlite from "bun:sqlite"; const db = new sqlite(process.env.DB_PATH); console.log(db.query("PRAGMA user_version").get().user_version); db.close();')
          if [ "$SEEDED_SCHEMA" != "$CURRENT_SCHEMA" ]; then
            echo "✓ Skipping ROSETTA_OFFLINE smoke: seeded DB schema v${SEEDED_SCHEMA} differs from current v${CURRENT_SCHEMA}, and offline recovery must fail for a genuine schema mismatch."
            exit 0
          fi

          PORT=18767
          LOG="${RUNNER_TEMP}/rosetta-offline-smoke-${{ matrix.os }}.log"
          rm -f "$LOG"
          echo "── ROSETTA_OFFLINE=1 bunx ${NPM_SPEC} --http (stale DB, no network refresh) ──"
          ROSETTA_OFFLINE=1 bunx "$NPM_SPEC" --http --port "$PORT" --host 127.0.0.1 > "$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          ok=0
          for _ in {1..30}; do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::Server exited early under ROSETTA_OFFLINE=1 — a release-tag-only mismatch should degrade gracefully, not crash"
              cat "$LOG"
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/mcp" || true)
            if [ "$code" != 000 ] && [ "$code" != 404 ]; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::MCP server never answered on /mcp under ROSETTA_OFFLINE=1"
            cat "$LOG"
            exit 1
          fi

          echo "── server log ──"
          cat "$LOG"

          if ! grep -F "ROSETTA_OFFLINE=1" "$LOG" > /dev/null; then
            echo "::error::Server log doesn't show the ROSETTA_OFFLINE short-circuit — did it skip the network attempt as intended?"
            exit 1
          fi
          echo "✓ Server started under ROSETTA_OFFLINE=1 with a release-tag-only mismatch, degrading gracefully instead of crashing"
