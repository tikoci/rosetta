# Curated device resolutions — the genuine odd-balls that the canonical matcher in
# src/assess-hardware.ts cannot resolve on its own. Each `[key]` is a matrix.csv
# "Product name". Everything NOT listed here resolves by rule (see device-map.tsv,
# regenerated by `make device-map`).
#
# Source of truth: the 2026-07-11 maintainer line-by-line review
# (briefings/B-0018-product-naming-three-source-map.md, which supersedes the raw notes in
# B-0017). Keep this file small — if a whole *class* of these starts recurring, prefer a matcher
# rule over more rows here. `make device-map` fails CI when a device NOT listed here stops
# auto-resolving, or when a device listed here starts auto-resolving (so stale exceptions get
# pruned).
#
# The device→URL map has two link columns, and a "gap" can be on EITHER side:
#   hw_url  = manual.mikrotik.com/hardware/<slug>   (the /hardware page)
#   www_url = mikrotik.com/product/<code>           (the marketing product page)
#
# class — names which side is missing / why auto-resolution failed, so a human (or MikroTik)
# can tell OUR mapping gaps from THEIR source-data gaps at a glance:
#   curated-alias    — BOTH pages exist, but under a marketing name no canonical rule can reach;
#                      the slug/code below are the human-verified truth. (our-side mapping)
#   no-hardware-page — MikroTik publishes no /hardware page for this SKU (THEIR doc gap; worth
#                      surfacing upstream). www_code given when the www product still exists.
#   no-www-product   — no mikrotik.com/product page could be located for this SKU. hardware_slug
#                      given when the /hardware page exists. (THEIR gap, or a slug we can't guess)
#   accessory        — a user-installable module (LTE/LoRa/wireless miniPCIe), not a standalone
#                      router/switch/AP; typically has a www product but no /hardware page by nature.

